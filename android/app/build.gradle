plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.lunamoo.isopackager'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.lunamoo.isopackager'
        minSdk 24
        targetSdk 35
        versionCode 200
        versionName '0.2.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DISOPK_BUILD_CLI=OFF', '-DISOPK_BUILD_TESTS=OFF'
                targets 'isopackager', 'SDL2'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI builds are signed with the debug key so they install; use your own key for releases.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1+'
        }
    }

    sourceSets {
        main {
            // SDL's Java side (SDLActivity and friends) straight from the submodule.
            java.srcDirs += ['../../external/SDL/android-project/app/src/main/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
