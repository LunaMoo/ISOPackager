name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DISOPK_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Self-test
        if: matrix.arch == 'x64'
        run: build\Release\isopk_selftest.exe "${{ runner.temp }}\isopk_selftest"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\isopackager-cli.exe dist\
          if (Test-Path build\Release\ISOPackager.exe) { Copy-Item build\Release\ISOPackager.exe dist\ }
          if (Test-Path build\Release\isopackager.exe) { Copy-Item build\Release\isopackager.exe dist\ISOPackager.exe }
          Copy-Item README.md dist\
      - uses: actions/upload-artifact@v4
        with:
          name: ISOPackager-windows-${{ matrix.arch }}
          path: dist

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DISOPK_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Self-test
        run: build/isopk_selftest "$RUNNER_TEMP/isopk_selftest"
      - uses: actions/upload-artifact@v4
        with:
          name: ISOPackager-linux-x64
          path: build/isopackager-cli

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DISOPK_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --parallel 4
      - name: Self-test
        run: build/isopk_selftest "$RUNNER_TEMP/isopk_selftest"
      - uses: actions/upload-artifact@v4
        with:
          name: ISOPackager-macos-universal
          path: build/isopackager-cli
