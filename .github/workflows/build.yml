name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.arch }} 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path configure.log -Pattern 'CMake Error|error' -Context 0,3 | Select-Object -First 15 | ForEach-Object { Write-Output "::error::$($_.Line) $($_.Context.PostContext -join ' ')" }
            exit 1
          }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel -- /nologo /v:minimal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 25 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
      - name: Self-test
        if: matrix.arch == 'x64'
        run: build\Release\isopk_selftest.exe "${{ runner.temp }}\isopk_selftest"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\isopackager-cli.exe dist\
          if (Test-Path build\Release\ISOPackager.exe) { Copy-Item build\Release\ISOPackager.exe dist\ }
          if (Test-Path build\Release\isopackager.exe) { Copy-Item build\Release\isopackager.exe dist\ISOPackager.exe }
          Copy-Item README.md dist\
      - uses: actions/upload-artifact@v5
        with:
          name: ISOPackager-windows-${{ matrix.arch }}
          path: dist

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libgl-dev libwayland-dev libxkbcommon-dev wayland-protocols libdbus-1-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Self-test
        run: build/isopk_selftest "$RUNNER_TEMP/isopk_selftest"
      - uses: actions/upload-artifact@v5
        with:
          name: ISOPackager-linux-x64
          path: |
            build/isopackager-cli
            build/isopackager

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --parallel 4
      - name: Self-test
        run: build/isopk_selftest "$RUNNER_TEMP/isopk_selftest"
      - uses: actions/upload-artifact@v5
        with:
          name: ISOPackager-macos-universal
          path: |
            build/isopackager-cli
            build/ISOPackager.app
